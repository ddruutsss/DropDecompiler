name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: DropDecompiler-portable
          path: dist/DropDecompiler-*.exe
      - name: Attach the EXE to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem dist/DropDecompiler-*.exe).FullName --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
